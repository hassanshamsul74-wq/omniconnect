workflows:
  default-workflow:
    name: OmniConnect Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android and iOS directories
        script: |
          flutter create . --platforms=android,ios
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
